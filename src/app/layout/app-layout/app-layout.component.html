<div class="app-layout">

  <!-- ========================================================= -->
  <!-- SIDEBAR -->
  <!-- ========================================================= -->

  <aside
    class="sidebar"
    [class.collapsed]="!sidebarOpen"
    (mouseenter)="onSidebarEnter()"
    (mouseleave)="onSidebarLeave()"
  >

    <!-- Decorative background -->
    <div class="sidebar-glow sidebar-glow-one"></div>
    <div class="sidebar-glow sidebar-glow-two"></div>

    <!-- ======================================================= -->
    <!-- SIDEBAR HEADER -->
    <!-- ======================================================= -->

    <div class="sidebar-header">

      <div class="brand-area">

        <!-- Expanded logo -->
        <span
          class="logo"
          *ngIf="sidebarOpen"
        >
          <span class="logo-mark">✈</span>
          <span class="logo-text">TravelMatch</span>
        </span>

        <!-- Collapsed logo -->
        <span
          class="logo-icon"
          *ngIf="!sidebarOpen"
          aria-label="TravelMatch"
        >
          ✈
        </span>

      </div>

      <!-- Sidebar toggle -->
      <button
        type="button"
        class="toggle-btn"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <span>{{ sidebarOpen ? '‹' : '›' }}</span>
      </button>

    </div>


    <!-- ======================================================= -->
    <!-- NAVIGATION LABEL -->
    <!-- ======================================================= -->

    <div
      class="nav-section-title"
      *ngIf="sidebarOpen"
    >
      <span>MAIN MENU</span>
    </div>


    <!-- ======================================================= -->
    <!-- MAIN NAVIGATION -->
    <!-- ======================================================= -->

    <nav class="main-nav">

      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarAfterNavigation()"
        data-label="Dashboard"
      >
        <span class="nav-icon">
          <span class="icon">🏠</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Dashboard
        </span>
      </a>


      <!-- Feed -->
      <a
        routerLink="/feed"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Feed"
      >
        <span class="nav-icon">
          <span class="icon">📰</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Feed
        </span>
      </a>


      <!-- Profile -->
      <a
        *ngIf="myUserId"
        [routerLink]="['/profile', myUserId]"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Profile"
      >
        <span class="nav-icon">
          <span class="icon">👤</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Profile
        </span>
      </a>


      <!-- Create Plan -->
      <a
        routerLink="/create-plan"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Create Plan"
      >
        <span class="nav-icon">
          <span class="icon">➕</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Create Plan
        </span>
      </a>


      <!-- Requests -->
      <a
        routerLink="/requests"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Requests"
      >
        <span class="nav-icon">
          <span class="icon">📩</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Requests
        </span>
      </a>


      <!-- Partners -->
      <a
        routerLink="/partners"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Partners"
      >
        <span class="nav-icon">
          <span class="icon">🤝</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Partners
        </span>
      </a>


      <!-- Notifications -->
      <a
        routerLink="/notifications"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        data-label="Notifications"
      >

        <span class="nav-icon notification-icon">

          <span class="icon">
            🔔
          </span>

          <span
            class="badge badge-icon"
            *ngIf="(unreadCount$ | async) as count"
          >
            {{ count }}
          </span>

        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          <span>Notifications</span>

          <span
            class="badge badge-inline"
            *ngIf="(unreadCount$ | async) as count"
          >
            {{ count }}
          </span>
        </span>

      </a>


      <!-- ===================================================== -->
      <!-- PREMIUM -->
      <!-- ===================================================== -->

      <a
        routerLink="/premium"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        class="premium-nav-item"
        data-label="Premium"
      >

        <span class="nav-icon premium-icon">
          <span class="icon">★</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Premium
        </span>

        <span
          class="premium-indicator"
          *ngIf="sidebarOpen"
        >
          PRO
        </span>

      </a>

    </nav>


    <!-- ======================================================= -->
    <!-- ADMIN SECTION -->
    <!-- ======================================================= -->

    <div
      class="admin-section"
      *ngIf="isAdmin"
    >

      <div
        class="section-heading"
        *ngIf="sidebarOpen"
      >
        <span>ADMINISTRATION</span>
      </div>

      <div class="admin-separator"></div>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        (click)="closeSidebarAfterNavigation()"
        class="admin-nav-item"
        data-label="Admin Panel"
      >

        <span class="nav-icon">
          <span class="icon">🛡️</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Admin Panel
        </span>

      </a>

    </div>


    <!-- ======================================================= -->
    <!-- SIDEBAR FOOTER -->
    <!-- ======================================================= -->

    <div class="sidebar-footer">

      <div
        class="footer-line"
        *ngIf="sidebarOpen"
      ></div>

      <!-- Logout -->
      <button
        type="button"
        class="logout"
        (click)="logout()"
        aria-label="Logout"
        data-label="Logout"
      >

        <span class="nav-icon">
          <span class="icon">🚪</span>
        </span>

        <span
          class="label"
          *ngIf="sidebarOpen"
        >
          Logout
        </span>

      </button>

    </div>

  </aside>


  <!-- ========================================================= -->
  <!-- MOBILE BACKDROP -->
  <!-- ========================================================= -->

  <div
    class="sidebar-backdrop"
    *ngIf="sidebarOpen"
    (click)="closeSidebarOnBackdrop()"
  ></div>


  <!-- ========================================================= -->
  <!-- MAIN WRAPPER -->
  <!-- ========================================================= -->

  <div class="main-wrapper">

    <!-- ======================================================= -->
    <!-- MOBILE TOPBAR -->
    <!-- ======================================================= -->

    <header class="mobile-topbar">

      <button
        type="button"
        class="mobile-menu-btn"
        (click)="toggleSidebar()"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <span class="mobile-topbar-title">
        <span class="mobile-logo-mark">✈</span>
        <span>TravelMatch</span>
      </span>


      <!-- Mobile notifications -->
      <a
        routerLink="/notifications"
        class="mobile-notif-link"
        aria-label="Notifications"
        (click)="closeSidebarAfterNavigation()"
      >

        <span class="mobile-notification-icon">
          🔔
        </span>

        <span
          class="badge badge-icon"
          *ngIf="(unreadCount$ | async) as count"
        >
          {{ count }}
        </span>

      </a>

    </header>


    <!-- ======================================================= -->
    <!-- CONTENT -->
    <!-- ======================================================= -->

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>


  <!-- ========================================================= -->
  <!-- CHATBOT -->
  <!-- ========================================================= -->

  <button
    type="button"
    class="chatbot-toggle"
    (click)="toggleChatbot()"
    aria-label="Open chatbot"
  >
    <span class="chatbot-icon">💬</span>
    <span class="chatbot-pulse"></span>
  </button>


  <app-chatbot
    *ngIf="showChatbot"
  ></app-chatbot>

</div>
