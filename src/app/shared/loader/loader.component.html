<div
  class="loader-overlay"
  *ngIf="loading"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <!-- Night sky -->
  <div class="stars-field" aria-hidden="true"></div>
  <div class="stars-twinkle" aria-hidden="true">
    <span class="star star-1"></span>
    <span class="star star-2"></span>
    <span class="star star-3"></span>
    <span class="star star-4"></span>
    <span class="star star-5"></span>
    <span class="star star-6"></span>
  </div>

  <div class="loader-content">

    <!-- Decorative background glow -->
    <div class="ambient-glow glow-one"></div>
    <div class="ambient-glow glow-two"></div>

    <!-- Globe / Travel Loader -->
    <div class="travel-loader">

      <!-- Outer orbit -->
      <div class="orbit orbit-large"></div>

      <!-- Inner orbit -->
      <div class="orbit orbit-small"></div>

      <!-- Orbit dots -->
      <div class="orbit-dot dot-one"></div>
      <div class="orbit-dot dot-two"></div>

      <!-- Globe -->
      <div class="globe">

        <div class="globe-highlight"></div>

        <div class="globe-latitude latitude-one"></div>
        <div class="globe-latitude latitude-two"></div>

        <div class="globe-longitude longitude-one"></div>
        <div class="globe-longitude longitude-two"></div>

        <div class="globe-land land-one"></div>
        <div class="globe-land land-two"></div>
        <div class="globe-land land-three"></div>

      </div>

      <!-- Airplane orbit path (rides exactly on orbit-large) -->
      <div class="airplane-orbit">
        <span class="airplane-trail trail-1"></span>
        <span class="airplane-trail trail-2"></span>
        <div class="airplane">✈</div>
      </div>

    </div>


    <!-- Loading information -->
    <div class="loader-info">

      <div class="loader-brand">
        <span class="brand-plane">✈</span>
        <span>TravelMatch</span>
      </div>

      <div class="loading-message">
        {{ message || 'Loading...' }}
      </div>

      <div class="loading-subtext">
        Please wait while we prepare your travel space
      </div>

      <!-- Animated progress dots -->
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>
</div>
