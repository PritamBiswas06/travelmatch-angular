<div class="auth-wrapper">
  <a routerLink="/" class="back-link">← Back to Home</a>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✈</div>
      <h2>Welcome Back</h2>
      <p>Enter your details to continue your journey</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->

      <div class="form-group">
        <label>Email Address</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>

          <input
            type="email"
            formControlName="email"
            placeholder="name@example.com"
          />
        </div>

        <small
          *ngIf="
            loginForm.get('email')?.touched && loginForm.get('email')?.invalid
          "
        >
          Please enter a valid email
        </small>
      </div>

      <!-- Password -->

      <div class="form-group">
        <label>Password</label>

        <div class="input-wrapper">
          <span class="input-icon">🔒</span>

          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
          />
        </div>

        <small
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
          "
        >
          Password must be at least 6 characters
        </small>

        <a routerLink="/forgot-password" class="forgot-link">
          Forgot Password?
        </a>
      </div>

      <!-- Backend Error -->

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button class="btn-auth" type="submit" [disabled]="loginForm.invalid">
        Login to TravelMatch
      </button>
    </form>

    <div class="auth-footer">
      <p>
        Don't have an account?
        <a routerLink="/register" class="link-highlight">Create Account</a>
      </p>
    </div>
  </div>
</div>
