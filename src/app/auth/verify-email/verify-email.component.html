<div class="verify-container">

  <div class="verify-card">

    <h2>Email Verification</h2>
    <p>Enter the 6-digit code sent to your email</p>

    <!-- hidden input -->
    <input
      class="otp-hidden-input"
      type="text"
      maxlength="6"
      inputmode="numeric"
      autocomplete="one-time-code"
      [(ngModel)]="otpValue"
      (input)="onOtpChange()"
      (paste)="onPaste($event)"
      #otpInput
    />

    <!-- visual boxes -->
    <div class="otp-box" (click)="focusInput()">
      <div class="otp-digit" *ngFor="let d of digits; let i=index">
        {{ otpValue[i] || '' }}
      </div>
    </div>

    <div class="resend-section">

  <span *ngIf="!canResend">
    Resend OTP in {{resendTimer}}s
  </span>

  <button
    *ngIf="canResend"
    class="resend-btn"
    (click)="resendOtp()">
    Resend OTP
  </button>

</div>


    <button (click)="verify()">Verify Email</button>

  </div>

</div>
