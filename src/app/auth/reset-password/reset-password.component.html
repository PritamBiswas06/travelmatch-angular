<div class="auth-wrapper">

  <div class="auth-card">

    <h2>Reset Password</h2>

    <form [formGroup]="form" (ngSubmit)="reset()">

      <input
        type="password"
        placeholder="New password"
        formControlName="password"
      />

      <button type="submit">
        Update Password
      </button>

    </form>

  </div>

</div>
